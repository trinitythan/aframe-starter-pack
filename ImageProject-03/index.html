<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>

  <body>
    <a-assets>
      <!-- Sky -->
      <img id="pinkSky" src="assets/pinkSky.jpg"> 
      
      <!-- Pedestal Assets -->
      <a-asset-item id="pedestal" src="assets/pedestal/pedestal.obj"></a-asset-item>
      <a-asset-item id="pedestal-mtl" src="assets/pedestal/model.mtl"></a-asset-item>

      <!-- Stone Floor -->
      <img id="stoneFloor" src="assets/stoneFloor.png">

      <!-- Doro Asset -->
      <a-asset-item id="doro" src="assets/doro/doro.obj"></a-asset-item>
      <a-asset-item id="doro-mtl" src="assets/doro/doro.mtl"></a-asset-item>

      <!-- Cat Asset -->
      <a-asset-item id="cat" src="assets/cat/oiiaioooooiai_cat.obj"></a-asset-item>
      <a-asset-item id="cat-mtl" src="assets/cat/oiiaioooooiai_cat.mtl"></a-asset-item>
    </a-assets>

    <a-scene>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" src="#stoneFloor"></a-plane>
      <a-sky src="#pinkSky"></a-sky>

      <!-- Models -->
      <a-obj-model src="#pedestal" mtl="#pedestal-mtl" position="0.447 0.970 -4.323" scale="0.015 0.015 0.013" rotation="-90 0 0" material="shader:flat;src:#pedestalText"></a-obj-model>
      
      <!-- Doro Models -->
      <a-obj-model src="#doro" mtl="#doro-mtl" position="-3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 65 0" class="clickable" animation="property:rotation;to:90 425 0;dur:3000;startEvents:click"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="0 0.003 -8.843" scale="1.5 1.5 1.5" rotation="90 0 0" class="clickable" animation="property:rotation;to:90 360 0;dur:3000;startEvents:click"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 -65 0" class="clickable" animation="property:rotation;to:90 -425 0;dur:3000;startEvents:click"></a-obj-model>
      
      <!-- Cat Model -->
      <a-obj-model src="#cat" mtl="#cat-mtl" position="0 1.056 -4.624" scale="4.75 4.75 4.75" rotation="0 20 0"></a-obj-model>

      <!-- Camera Cursor -->
      <a-camera>
        <a-cursor color="white"></a-cursor>
      </a-camera>

    </a-scene>
  </body>
</html>
