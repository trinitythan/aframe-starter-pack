<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>

  <body>
    <a-assets>
      <!-- Sky -->
      <img id="pinkSky" src="assets/pinkSky.jpg"> 
      
      <!-- Pedestal Assets -->
      <a-asset-item id="pedestal" src="assets/pedestal/pedestal.obj"></a-asset-item>
      <!-- <a-asset-item id="pedestal-mtl" src="assets/pedestal/model.mtl"></a-asset-item> -->

      <!-- Stone Floor -->
      <img id="stoneFloor" src="assets/stoneFloor.png">

      <!-- Doro Asset -->
      <a-asset-item id="doro" src="assets/doro/doro.obj"></a-asset-item>
      <a-asset-item id="doro-mtl" src="assets/doro/doro.mtl"></a-asset-item>

      <!-- Cat Asset -->
      <a-asset-item id="cat" src="assets/cat/oiiaioooooiai_cat.obj"></a-asset-item>
      <a-asset-item id="cat-mtl" src="assets/cat/oiiaioooooiai_cat.mtl"></a-asset-item>

      <!-- Archway Asset -->
      <a-asset-item id="archway" src="assets/archway/free_ultra-low_poly_snowy_stone_arch.obj"></a-asset-item>
      <a-asset-item id="archway-mtl" src="assets/archway/free_ultra-low_poly_snowy_stone_arch.mtl"></a-asset-item>

      <!-- Waterfall Asset -->
      <a-asset-item id="waterfall" src="assets/waterfalls/artificial_stone_waterfall.obj"></a-asset-item>
      <a-asset-item id="waterfall-mtl" src="assets/waterfalls/artificial_stone_waterfall.mtl"></a-asset-item>

      <!-- Trees Assets  -->
       <a-asset-item id="trees" src="assets/trees/rocks_and_trees.obj"></a-asset-item>
       <a-asset-item id="trees-mtl" src="assets/trees/rocks_and_trees.mtl"></a-asset-item>

    </a-assets>

    <a-scene>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" src="#stoneFloor"></a-plane>
      <a-sky src="#pinkSky"></a-sky>

      <!-- Pedestal Models -->
      <a-obj-model src="#pedestal" mtl="#pedestal-mtl" position="0.447 0.970 -4.323" scale="0.015 0.015 0.013" rotation="-90 0 0" color="gray"></a-obj-model>
      
      <!-- Doro Models -->
      <a-obj-model src="#doro" mtl="#doro-mtl" position="-3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 65 0" class="clickable" animation="property:rotation;to:90 425 0;dur:3000;startEvents:click"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="0 0.003 -8.843" scale="1.5 1.5 1.5" rotation="90 0 0" class="clickable" animation="property:rotation;to:90 360 0;dur:3000;startEvents:click"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 -65 0" class="clickable" animation="property:rotation;to:90 -425 0;dur:3000;startEvents:click"></a-obj-model>
      
      <!-- Cat Model -->
      <a-obj-model src="#cat" mtl="#cat-mtl" position="0 1.056 -4.624" scale="4.75 4.75 4.75" rotation="0 20 0"></a-obj-model>

      <!-- Archway Model -->
      <a-obj-model src="#archway" mtl="#archway-mtl" position="0 3.495 4.571" scale="6 6 6" rotation="0 0 0"></a-obj-model>
      <a-obj-model src="#archway" mtl="#archway-mtl" position="0 3.495 -12.56" scale="6 6 6" rotation="0 0 0"></a-obj-model>

      <a-obj-model src="#archway" mtl="#archway-mtl" position="8.621 3.495 -4.665" scale="6 6 6" rotation="0 90 0"></a-obj-model>
      <a-obj-model src="#archway" mtl="#archway-mtl" position="-8.395 3.495 -4.665" scale="6 6 6" rotation="0 -90 0"></a-obj-model>

      <!-- Waterfall Model -->
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="-5.936 1.927 -10.59" scale="0.016 0.016 0.012" rotation="0 45 0"></a-obj-model>
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="5.936 1.927 -10.59" scale="0.016 0.016 0.012" rotation="0 -45 0"></a-obj-model>

      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="6.358 1.927 1.682" scale="0.016 0.016 0.012" rotation="0 -135 0"></a-obj-model>
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="-6.092 1.927 1.677" scale="0.016 0.016 0.012" rotation="0 135 0"></a-obj-model>

      <!-- Tree Models -->
      <a-obj-model src="#trees" mtl="#trees-mtl" position="-13.140 9.180 -13.140" scale="34.380 50 43.670" rotation="0 28.880 0"></a-obj-model>
      <a-obj-model src="#trees" mtl="#trees-mtl" position="10.7 8.611 -9.152" scale="34.380 50 43.670" rotation="0 270 0"></a-obj-model>
      <a-obj-model src="#trees" mtl="#trees-mtl" position="-2.230 9.002 7.542" scale="33.790 49.880 36.140" rotation="0 146.94 0"></a-obj-model>

      <!-- Camera Cursor -->
      <a-camera>
        <a-cursor color="white"></a-cursor>
      </a-camera>

    </a-scene>
  </body>
</html>
