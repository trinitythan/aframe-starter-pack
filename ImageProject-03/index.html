<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>

  <!-- Spin Controller -->
  <script>
    let doroCount = 0;
    let totalDoros = 3;
    let activated = false;

    AFRAME.registerComponent('doro-spin', {
      init: function () {
        this.isSpinning = false;
        this.hasBeenClicked = false;

        // Saving the original postions of the doro and cat
        let pos = this.el.getAttribute('position');
        this.originalPosition = { x: pos.x, y: pos.y, z: pos.z };
        let rot = this.el.getAttribute('rotation');
        this.originalRotation = { x: rot.x, y: rot.y, z: rot.z };

        this.el.addEventListener('click', () => {
          if (this.isSpinning) return;

          this.isSpinning = true;
          let startRotation = this.el.getAttribute('rotation');

          // play normal sound
          this.el.emit('doroSpin');

          // only counts when each different doro has been clicked once
          if (!this.hasBeenClicked) {
            this.hasBeenClicked = true;
            doroCount++;
          }

          // spin animation
          this.el.removeAttribute('animation'); 
          this.el.setAttribute('animation', {
            property: 'rotation',
            to: `90 ${startRotation.y + 360} 0`,
            dur: 2000,
            easing: 'linear'
          });

          // checking if each doro has been clicked
          setTimeout(() => {
          this.isSpinning = false;

          // Triggers animation only after doro finishes spinning
            if (doroCount === totalDoros && !activated) {
              activated = true;
              triggerFinalEvent();
            }
          }, 2000);


        });
      }
    });

    // Dancing Event Funciton
    function triggerFinalEvent() {
      console.log("ALL DOROS ACTIVATED");

      // play sound
      document.querySelector('#danceSoundPlayer').components.sound.playSound();

      // making the light change colos 
      let cone = document.querySelector('#lightCone');
        cone.setAttribute('animation__color', {
          property: 'material.color',
          to: '#ff00a2',
          dur: 500,
          dir: 'alternate',
          loop: true
      });

      let doros = document.querySelectorAll('[doro-spin]');

      doros.forEach(doro => {
        // resets position first
        let pos = doro.object3D.position;
        doro.setAttribute('position', {
          x: pos.x,
          y: pos.y,
          z: pos.z
        });

        doro.setAttribute('animation__bounce', {
          property: 'position',
          dir: 'alternate',
          dur: 2000,
          loop: true,
          easing: 'easeInOutSine',
          to: `${pos.x} ${pos.y + 1} ${pos.z}`
        });
      });

      // cat reset
      let cat = document.querySelector('#catModel');

      cat.setAttribute('animation__float', {
        property: 'position',
        dir: 'alternate',
        dur: 2000,
        loop: true,
        easing: 'easeInOutSine',
        to: '0 2 -4.624'
      });
      setTimeout(resetScene, 8000);
    }

    function resetScene() {
      let doros = document.querySelectorAll('[doro-spin]');

      doros.forEach(doro => {
        // resets light
        let cone = document.querySelector('#lightCone');
        cone.removeAttribute('animation__color');
        cone.setAttribute('material', 'color', '#fffdc9');

        let comp = doro.components['doro-spin'];
        doro.removeAttribute('animation');

        // stopping dance animation
        doro.removeAttribute('animation__bounce');

        // reset position
        doro.setAttribute('position', comp.originalPosition);

        // reset rotation
        doro.setAttribute('rotation', comp.originalRotation);

        comp.hasBeenClicked = false;
        comp.isSpinning = false;
      });

      let cat = document.querySelector('#catModel');

      // remove dance animation
      cat.removeAttribute('animation__float');

      // original float
      cat.setAttribute('animation__float', {
        property: 'position',
        dir: 'alternate',
        dur: 2000,
        loop: true,
        easing: 'easeInOutSine',
        to: '0 1.5 -4.624'
      });

      // original spin
      cat.setAttribute('animation__spin', {
        property: 'rotation',
        to: '0 380 0',
        dur: 5000,
        loop: true,
        easing: 'linear'
      });

      // reset sync dance
      doroCount = 0;
      activated = false;
    }
</script>

  <body>
    <a-assets>
      <!-- Sky -->
      <img id="pinkSky" src="assets/pinkSky.jpg"> 
      
      <!-- Pedestal Assets -->
      <a-asset-item id="pedestal" src="assets/pedestal/pedestal.obj"></a-asset-item>
      <!-- <a-asset-item id="pedestal-mtl" src="assets/pedestal/model.mtl"></a-asset-item> -->

      <!-- Stone Floor -->
      <img id="stoneFloor" src="assets/stoneFloor.png">

      <!-- Doro Asset -->
      <a-asset-item id="doro" src="assets/doro/doro.obj"></a-asset-item>
      <a-asset-item id="doro-mtl" src="assets/doro/doro.mtl"></a-asset-item>

      <!-- Doro Sound -->
      <audio id="slowOoEeAh" src="assets/dancingSounds/slow OO EE AH.mp3" volume="10"></audio>

      <!-- Cat Asset -->
      <a-asset-item id="catModel" src="assets/cat/oiiaioooooiai_cat.obj"></a-asset-item>
      <a-asset-item id="cat-mtl" src="assets/cat/oiiaioooooiai_cat.mtl"></a-asset-item>

      <!-- Archway Asset -->
      <a-asset-item id="archway" src="assets/archway/free_ultra-low_poly_snowy_stone_arch.obj"></a-asset-item>
      <a-asset-item id="archway-mtl" src="assets/archway/free_ultra-low_poly_snowy_stone_arch.mtl"></a-asset-item>

      <!-- Waterfall Asset -->
      <a-asset-item id="waterfall" src="assets/waterfalls/artificial_stone_waterfall.obj"></a-asset-item>
      <a-asset-item id="waterfall-mtl" src="assets/waterfalls/artificial_stone_waterfall.mtl"></a-asset-item>

      <!-- Trees Assets  -->
       <a-asset-item id="trees" src="assets/trees/rocks_and_trees.obj"></a-asset-item>
       <a-asset-item id="trees-mtl" src="assets/trees/rocks_and_trees.mtl"></a-asset-item>

      <!-- Background sound -->
      <audio id="backgroundSound" src="assets/backgroundSound.mp3" volume="0.3" autoplay loop></audio>

      <!-- Dancing Sound -->
      <audio id="danceSoundFile" src="assets/dancingSounds/oo ee ahh .mp3"></audio>    </a-assets>

    <a-scene>      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" src="#stoneFloor"></a-plane>
      
      <a-plane position="0 -0.95 -4" rotation="-90 0 0" width="90" height="90" color="green"></a-plane>

      
      <a-sky src="#pinkSky"></a-sky>

      <!-- Pedestal Models -->
      <a-obj-model src="#pedestal" mtl="#pedestal-mtl" position="0.447 0.970 -4.323" scale="0.015 0.015 0.013" rotation="-90 0 0" color="gray"></a-obj-model>
      
      <!-- Doro Models -->
      <a-obj-model src="#doro" mtl="#doro-mtl" position="-3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 65 0" doro-spin sound="src: #slowOoEeAh; on: doroSpin"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="0 0.003 -8.843" scale="1.5 1.5 1.5" rotation="90 0 0" doro-spin sound="src: #slowOoEeAh; on: doroSpin"></a-obj-model>
      <a-obj-model src="#doro" mtl="#doro-mtl" position="3.769 0.003 -4.850" scale="1.5 1.5 1.5" rotation="90 -65 0" doro-spin sound="src: #slowOoEeAh; on: doroSpin"></a-obj-model>
      
      <!-- Cat Model -->
      <a-obj-model src="#catModel" mtl="#cat-mtl" position="0 1.056 -4.624" scale="4.75 4.75 4.75" rotation="0 20 0"
        animation__spin="property:rotation;to:0 380 0;dur:5000;loop:true;easing:linear"
        animation__float="property: position; dir: alternate; dur:2000; loop: true; easing:easeInOutSine; to: 0 1.5 -4.624">
      </a-obj-model>

      <!-- Higher Being Light -->
      <a-cone id="lightCone" position="-6.15 25.817 -15.125" radius-bottom="2.15" radius-top="0.1" height="60" rotation="-6.610 -45.070 25" color="#fffdc9" opacity="0.15"></a-cone>

      <!-- Archway Model -->
      <a-obj-model src="#archway" mtl="#archway-mtl" position="0 3.495 4.571" scale="6 6 6" rotation="0 0 0"></a-obj-model>
      <a-obj-model src="#archway" mtl="#archway-mtl" position="0 3.495 -12.56" scale="6 6 6" rotation="0 0 0"></a-obj-model>

      <a-obj-model src="#archway" mtl="#archway-mtl" position="8.621 3.495 -4.665" scale="6 6 6" rotation="0 90 0"></a-obj-model>
      <a-obj-model src="#archway" mtl="#archway-mtl" position="-8.395 3.495 -4.665" scale="6 6 6" rotation="0 -90 0"></a-obj-model>

      <!-- Waterfall Model -->
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="-5.936 1.927 -10.59" scale="0.016 0.016 0.012" rotation="0 45 0"></a-obj-model>
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="5.936 1.927 -10.59" scale="0.016 0.016 0.012" rotation="0 -45 0"></a-obj-model>

      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="6.358 1.927 1.682" scale="0.016 0.016 0.012" rotation="0 -135 0"></a-obj-model>
      <a-obj-model src="#waterfall" mtl="#waterfall-mtl" position="-6.092 1.927 1.677" scale="0.016 0.016 0.012" rotation="0 135 0"></a-obj-model>

      <!-- Tree Models -->
      <a-obj-model src="#trees" mtl="#trees-mtl" position="-13.140 9.157 -13.140" scale="34.380 50 43.670" rotation="0 28.880 0"></a-obj-model>
      <a-obj-model src="#trees" mtl="#trees-mtl" position="10.7 9.157 -9.152" scale="34.380 50 43.670" rotation="0 270 0"></a-obj-model>
      <a-obj-model src="#trees" mtl="#trees-mtl" position="-2.230 9.157 7.542" scale="33.790 49.880 36.140" rotation="0 146.94 0"></a-obj-model>

      <!-- Dancing Sound Effect -->
      <a-entity id="danceSoundPlayer" sound="src: #danceSoundFile"></a-entity>

      <!-- Camera Cursor -->
      <a-camera>
        <a-cursor color="white" scale="0.35 0.35"></a-cursor>
      </a-camera>

    </a-scene>
  </body>
</html>
