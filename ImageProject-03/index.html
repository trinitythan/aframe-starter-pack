<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-assets>
      <!-- Sky -->
      <img id="pinkSky" src="assets/pinkSky.jpg"> 
      
      <!-- Pedestal Assets -->
      <img id="pedestalText" src="assets/pedestal.png">     
      <a-asset-item id="pedestal" src="assets/pedestal.obj"></a-asset-item>
    
    </a-assets>

    <a-scene>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky src="#pinkSky"></a-sky>

      <a-obj-model src="#pedestal" position="0.447 0.970 -4.323" rotation="-90 0 0"scale="0.015 0.015 0.013" material="shader:flat;src:#pedestalText"></a-obj-model>
    </a-scene>
  </body>
</html>
